; Demo bar used by `scripts/demo.sh polybar` (and to record the README GIF).
; Self-contained: fake workspaces on the left, ccoverseer modules, a clock.
; Launch through demo.sh, which sets CCO_ROOT and the demo cache variables.

[colors]
background = #1e1e2e
foreground = #cdd6f4
dim = #6c7086
accent = #89b4fa

[bar/demo]
width = 100%
height = 32
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
padding = 2
module-margin = 1
font-0 = "Iosevka Nerd Font:pixelsize=15;3"
font-1 = "DejaVu Sans:pixelsize=15;3"
modules-left = workspaces sep ccoverseer sep usage
modules-right = clock
; Keep `polybar-msg` aimed at the user's real bars away from this one.
enable-ipc = false
override-redirect = false
wm-name = ccoverseer-demo

[module/workspaces]
type = custom/text
format = "%{B#313244}%{F#89b4fa} 1 %{F-}%{B-} 2  3  4 "

[module/sep]
type = custom/text
format = "%{F#45475a}|%{F-}"

[module/ccoverseer]
type = custom/script
exec = "$CCO_ROOT"/renderers/polybar/agents.sh
interval = 0.5
label = %output%

[module/usage]
type = custom/script
exec = "$CCO_ROOT"/renderers/polybar/usage.sh
interval = 0.5
format-prefix = "claude "
format-prefix-foreground = ${colors.dim}
label = %output%

[module/clock]
type = internal/date
interval = 5
time = %H:%M
label = %time%
