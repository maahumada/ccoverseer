; Example polybar modules. Add "ccoverseer" (and optionally "ccoverseer-usage")
; to modules-left/center/right of your bar.

[module/ccoverseer]
type = custom/script
exec = ~/.local/share/ccoverseer/renderers/polybar/agents.sh
interval = 2
format = <label>
label = %output%

[module/ccoverseer-usage]
type = custom/script
exec = ~/.local/share/ccoverseer/renderers/polybar/usage.sh
interval = 30
format = <label>
format-prefix = "claude "
label = %output%
